    <text x="45" y="111" font-weight="700">achieve</text><text x="203" y="111">??t ???c</text><text x="370" y="111" fill="#67d9ef">/??t?i?v/</text><text x="548" y="101">I want to achieve</text><text x="548" y="120">my goal.</text><text x="755" y="111">Basic</text>
    <text x="45" y="175" font-weight="700">environment</text><text x="203" y="175">môi tr??ng</text><text x="370" y="175" fill="#67d9ef">/?n?va?r?nm?nt/</text><text x="548" y="165">Protect the</text><text x="548" y="184">environment.</text><text x="755" y="175">Nature</text>
    <text x="45" y="239" font-weight="700">collaborate</text><text x="203" y="239">h?p tác</text><text x="370" y="239" fill="#67d9ef">/k??læb?re?t/</text><text x="548" y="229">Teams collaborate</text><text x="548" y="248">efficiently.</text><text x="755" y="239">Business</text>
