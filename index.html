
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocaLearn - English Vocabulary</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:#f8fafc;
}
header{
  padding:22px 8%;
  background:#111c30;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #263750;
}
.logo{font-size:25px;font-weight:bold;color:#38bdf8}
nav a{color:#cbd5e1;text-decoration:none;margin-left:22px}
main{max-width:1050px;margin:65px auto;padding:20px}
.hero{text-align:center;margin-bottom:45px}
.hero h1{font-size:42px}
.hero p{color:#94a3b8;line-height:1.7}
button{
  background:#3b82f6;color:white;border:0;
  padding:12px 22px;border-radius:9px;
  cursor:pointer;font-size:15px;
}
button:hover{background:#2563eb}
.card{
  max-width:600px;margin:25px auto;
  background:#17243a;border:1px solid #2b405c;
  border-radius:18px;padding:40px;text-align:center;
}
.word{font-size:35px;font-weight:bold;margin:20px}
.meaning{font-size:22px;color:#38bdf8;margin:20px}
.info{color:#94a3b8;margin:15px}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
footer{text-align:center;color:#64748b;padding:35px}
</style>
</head>
<body>
<header>
  <div class="logo">VocaLearn.</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#learn">Learning</a>
  </nav>
</header>

<main id="home">
  <section class="hero">
    <h1>Learn English. One Word at a Time.</h1>
    <p>
      Build your vocabulary, improve your pronunciation
      and make English learning easier every day.
    </p>
    <a href="#learn"><button>Start Learning</button></a>
  </section>

  <section id="learn">
    <h2 style="text-align:center">Vocabulary Flashcards</h2>
    <div class="card">
      <div class="info" id="count">Word 1 of 5</div>
      <div class="word" id="word">Beautiful</div>
      <div class="meaning" id="meaning" hidden>Đẹp</div>
      <div class="info" id="example" hidden>
        Example: This is a beautiful place.
      </div>
      <div class="actions">
        <button onclick="showMeaning()">Show Meaning</button>
        <button onclick="nextWord()">Next Word →</button>
      </div>
    </div>
  </section>
</main>

<footer>
  © 2026 VocaLearn. Learn something new every day.
</footer>

<script>
const words=[
  {en:"Beautiful",vi:"Đẹp",ex:"This is a beautiful place."},
  {en:"Improve",vi:"Cải thiện",ex:"I want to improve my English."},
  {en:"Knowledge",vi:"Kiến thức",ex:"Knowledge is important."},
  {en:"Opportunity",vi:"Cơ hội",ex:"This is a great opportunity."},
  {en:"Confident",vi:"Tự tin",ex:"Be confident when speaking."}
];

let current=0;

function render(){
  const w=words[current];
  document.getElementById("word").textContent=w.en;
  document.getElementById("meaning").textContent=w.vi;
  document.getElementById("example").textContent="Example: "+w.ex;
  document.getElementById("count").textContent=
    `Word ${current+1} of ${words.length}`;
  document.getElementById("meaning").hidden=true;
  document.getElementById("example").hidden=true;
}

function showMeaning(){
  document.getElementById("meaning").hidden=false;
  document.getElementById("example").hidden=false;
}

function nextWord(){
  current=(current+1)%words.length;
  render();
}
render();
</script>
</body>
</html>
